name: Platform builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            bundle: dmg
            arch: AppleSilicon
          - label: macOS Intel
            os: macos-15-intel
            bundle: dmg
            arch: Intel
          - label: Windows x64
            os: windows-2025
            bundle: nsis
          - label: Linux x64
            os: ubuntu-24.04
            bundle: deb
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            bundle: deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run safety and compatibility tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build the beginner interface
        run: npm run build

      - name: Build native installer
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mus-${{ matrix.label }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mus-${{ matrix.label }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mus-${{ matrix.label }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: mus-*
          path: release-assets
          merge-multiple: true

      - name: Check release tag matches application version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Create SHA-256 checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Test release

          This release contains automated builds for macOS Apple Silicon and Intel, Windows x64, and Linux x64/ARM64.

          **Windows and Linux packages have only been compiled in CI. They have not yet been interactively validated on those operating systems.** Please treat them as tester builds and report the OS version and results before relying on them for a new server installation.

          macOS packages are not notarized with a Developer ID certificate. Windows packages are not signed with a publisher certificate. Do not treat these installers as a warning-free general release.

          SHA-256 checksums for all attached installers are included in `SHA256SUMS.txt`.
          NOTES
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft --prerelease \
            --title "Minecraft Universal Server $GITHUB_REF_NAME" \
            --notes-file release-notes.md
